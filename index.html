<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TalentUpstream | Attunement Talent Acquisition</title>
<meta name="description" content="TalentUpstream helps build stronger GTM talent pipelines through Attunement Talent Acquisition." />
<meta property="og:title" content="TalentUpstream | Attunement Talent Acquisition" />
<meta property="og:description" content="The right people. Doing the right things. Driving real results." />
<meta property="og:url" content="https://www.talentupstream.com" />
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:#00131e}
  body{margin:0;background:#00131e;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
  .site{width:100%;max-width:1664px;margin:0 auto;background:#00131e}
  .slice{position:relative;width:100%;line-height:0}
  .slice img{display:block;width:100%;height:auto;margin:0;padding:0}
  .hotspot{position:absolute;display:block;z-index:5;text-decoration:none;background:transparent;border:0;cursor:pointer}
  .hotspot:focus-visible{outline:3px solid #16b8ad;outline-offset:2px;border-radius:8px}
  /* nav hotspots in the first slice; percentages preserve position at every width */
  .nav-market{left:38.0%;top:1.0%;width:12.8%;height:8.5%}
  .nav-diff{left:53.2%;top:1.0%;width:10.7%;height:8.5%}
  .nav-success{left:66.2%;top:1.0%;width:12.6%;height:8.5%}
  .nav-outcomes{left:80.2%;top:1.0%;width:8.8%;height:8.5%}
  .nav-talk{left:90.1%;top:0.7%;width:7.6%;height:8.5%}
  .market-video{left:43.8%;top:21.0%;width:51%;height:51%}
  .diff-video{left:59.0%;top:13.0%;width:36.0%;height:52%}
  .outcome-video{left:57.5%;top:6.5%;width:37.0%;height:58%}
  .cta-talk{left:49.2%;top:22%;width:20.5%;height:23%}
  .privacy{left:75%;top:70%;width:10%;height:25%}
  .contact{left:87%;top:70%;width:8%;height:25%}
  .anchor{position:absolute;top:0;left:0;width:1px;height:1px}
  @media (max-width:700px){
    /* Keep exact approved art direction; the whole composition scales proportionally. */
    .site{width:100%;}
  }
</style>
</head>
<body>
<main class="site" aria-label="TalentUpstream homepage">
  <section id="market-challenge" class="slice" aria-label="Market Challenge">
    <img src="assets/market-challenge.png" alt="Market Challenge: Hiring and retaining GTM sales talent is harder than ever." />
    <a class="hotspot nav-market" href="#market-challenge" aria-label="Market Challenge"></a>
    <a class="hotspot nav-diff" href="#differentiator" aria-label="Differentiator"></a>
    <a class="hotspot nav-success" href="#candidate-success" aria-label="Candidate Success"></a>
    <a class="hotspot nav-outcomes" href="#outcomes" aria-label="Outcomes"></a>
    <a class="hotspot nav-talk" href="mailto:john@talentupstream.com" aria-label="Talk to us"></a>
    <button class="hotspot market-video" type="button" aria-label="Market Challenge video placeholder" onclick="alert('Video coming soon.')"></button>
  </section>

  <section id="differentiator" class="slice" aria-label="Differentiator">
    <img src="assets/differentiator.png" alt="Differentiator: Attunement Talent Acquisition." />
    <button class="hotspot diff-video" type="button" aria-label="Differentiator video placeholder" onclick="alert('Video coming soon.')"></button>
  </section>

  <section id="candidate-success" class="slice" aria-label="Candidate Success">
    <img src="assets/candidate-success.png" alt="Candidate Success: Recruiting and Onboarding, Training and Leadership, and Sales Fulfillment." />
  </section>

  <section id="outcomes" class="slice" aria-label="Outcome for You">
    <img src="assets/outcomes.png" alt="Outcome for You: The right people. Doing the right things. Driving real results. Growth, cars, and jets." />
    <button class="hotspot outcome-video" type="button" aria-label="Outcome video placeholder" onclick="alert('Video coming soon.')"></button>
  </section>

  <section id="contact" class="slice" aria-label="Contact TalentUpstream">
    <img src="assets/cta-footer.png" alt="Let's build your talent pipeline. Talk to TalentUpstream." />
    <a class="hotspot cta-talk" href="mailto:john@talentupstream.com?subject=TalentUpstream%20Conversation" aria-label="Talk to TalentUpstream"></a>
    <a class="hotspot privacy" href="privacy_policy.html" aria-label="Privacy Policy"></a>
    <a class="hotspot contact" href="mailto:john@talentupstream.com" aria-label="Contact"></a>
  </section>
</main>
</body>
</html>
